name: Deploy to EC2
on:
    push:
        branches:
            - main

env:
    DOTNET_CONFIGURATION: release

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
        
            - name: Build project and run tests
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '8.0.10'
            - run: dotnet build -c $DOTNET_CONFIGURATION
            - run: echo "build successful"
            - run: echo "running tests..."
            - run: echo "test completed"
    push:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Push project to ecr
              run: echo "Project being pushed to ecr"
    deploy:
        runs-on: ubuntu-latest
        needs: push
        steps:
            - name: Deploy project to ec2
              run: echo "Deploy project to ec2 server"