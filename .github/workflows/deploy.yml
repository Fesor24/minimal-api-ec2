name: Deploy to EC2
on:
    push:
        branches:
            - main

env:
    DOTNET_CONFIGURATION: release
    AWS_REGION: eu-west-2

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3
        
            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '8.0.103'

            - name: Build project and run tests
              run: | 
                dotnet build -c $DOTNET_CONFIGURATION
                echo "build successful"
                echo "running tests..."
                echo "test completed"
    push:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout repo
            - uses: actions/checkout@v3
            
            - name: Configure credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::533267394084:role/github-action
                aws-region: $AWS_REGION

            - name: Login to ECR private repo
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag and push image to ecr
              env:
                REGISTRY: ${{steps.login-ecr.outputs.registry}}
                REPOSITORY: my-ecr-repo
                IMAGE_TAG: ${{github.sha}}
              run: |
                echo $REGISTRY
                echo $IMAGE_TAG
    deploy:
        runs-on: ubuntu-latest
        needs: push
        steps:
            - name: Deploy project to ec2
              run: echo "Deploy project to ec2 server"